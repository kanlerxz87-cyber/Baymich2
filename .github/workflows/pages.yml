name: Deploy static guide to GitHub Pages

on:
  push:
    branches: [main, arena/0d35b38f-baymich2]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate structured data and required sources
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          restaurants = json.loads(Path('data/restaurants.json').read_text())
          hotels = json.loads(Path('data/hotels.json').read_text())
          assert len(restaurants) == 41, f'Expected 41 current starred restaurants, got {len(restaurants)}'
          assert all(r.get('name') and r.get('city') and r.get('stars') in (1, 2, 3) and r.get('michelinUrl', '').startswith('https://guide.michelin.com/') for r in restaurants)
          assert all(h.get('name') and h.get('source', '').startswith('https://') for h in hotels)
          assert Path('index.html').is_file() and Path('styles.css').is_file() and Path('app.js').is_file()
          print(f'Validated {len(restaurants)} restaurants and {len(hotels)} hotels')
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
